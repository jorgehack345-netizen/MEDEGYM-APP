name: Build MEDEGYM EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r MEDEGYM_app\requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm --noconsole --onefile ^
            --name MEDEGYM_Control ^
            --add-data "MEDEGYM_app\config.json;." ^
            MEDEGYM_app\app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MEDEGYM_Control_EXE
          path: dist/MEDEGYM_Control.exe
